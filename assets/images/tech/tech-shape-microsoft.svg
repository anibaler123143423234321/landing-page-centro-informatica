<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="msFloatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#073299" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 100% TRANSPARENT - ZERO BACKGROUND BOX OR CARD -->
  <g filter="url(#msFloatGlow)">
    <!-- Microsoft Official 4 Squares -->
    <!-- Red (Top-Left) -->
    <rect x="26" y="26" width="69" height="69" rx="8" fill="#F25022"/>
    <!-- Green (Top-Right) -->
    <rect x="105" y="26" width="69" height="69" rx="8" fill="#7FBA00"/>
    <!-- Blue (Bottom-Left) -->
    <rect x="26" y="105" width="69" height="69" rx="8" fill="#00A4EF"/>
    <!-- Yellow (Bottom-Right) -->
    <rect x="105" y="105" width="69" height="69" rx="8" fill="#FFB900"/>
  </g>
</svg>
